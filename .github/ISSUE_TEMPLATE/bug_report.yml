name: Bug report
description: Something in Choose With doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add .svg in Settings
        2. Double-click an .svg file in Finder
        3. …
    validations:
      required: true
  - type: input
    id: extensions
    attributes:
      label: Extensions involved
      placeholder: svg, md
  - type: input
    id: version
    attributes:
      label: Choose With version
      description: In About (menu bar icon → About), or `choosewith --help`.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 27.2
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - Homebrew
        - Download from GitHub releases
        - Built from source
